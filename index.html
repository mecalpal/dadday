<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>DAD DAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #E8E0CE;
            --paper-2: #EFE8D8;
            --ink: #29241E;
            --ink-soft: #6B6356;
            --rule: #cdc2a8;
            --accent: #356B63;
            --play: #C0492F;
            --shadow: rgba(41, 36, 30, .18);
            --photo: #fcfbf6;
            --tape: rgba(212, 198, 156, .5);
        }

        * {
            box-sizing: border-box
        }

        html {
            -webkit-text-size-adjust: 100%
        }

        body {
            margin: 0;
            background:
                radial-gradient(120% 90% at 50% -10%, #f1ead9 0%, var(--paper) 55%, #ded3ba 100%);
            color: var(--ink);
            font-family: "Inter", system-ui, sans-serif;
            line-height: 1.5;
            padding: clamp(16px, 5vw, 48px) clamp(14px, 5vw, 24px) 64px;
            min-height: 100vh;
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            background: var(--paper-2);
            border: 1px solid #d4c8ac;
            border-radius: 6px;
            box-shadow: 0 18px 40px -18px var(--shadow), 0 2px 0 #fff inset;
            padding: clamp(20px, 6vw, 40px);
        }

        .eyebrow {
            font-family: "Space Mono", monospace;
            font-size: 12px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 6px;
        }

        .title {
            font-family: "Caveat", cursive;
            font-weight: 700;
            font-size: clamp(44px, 12vw, 68px);
            line-height: .92;
            margin: 0 0 4px;
        }

        .dedication {
            font-family: "Caveat", cursive;
            font-size: clamp(20px, 5.5vw, 26px);
            color: var(--ink-soft);
            margin: 8px 0 0;
        }

        .cassette {
            display: block;
            width: 88px;
            height: auto;
            margin: 0 0 14px
        }

        .divider {
            height: 0;
            border: 0;
            border-top: 1.5px solid var(--rule);
            margin: 24px 0
        }

        /* ---------- tracklist ---------- */
        .track {
            display: grid;
            grid-template-columns: 34px 1fr;
            gap: 14px;
            padding: 18px 0;
            border-bottom: 1px solid var(--rule)
        }

        .track:last-child {
            border-bottom: 0
        }

        .num {
            font-family: "Space Mono", monospace;
            font-weight: 700;
            font-size: 14px;
            color: var(--accent);
            padding-top: 2px
        }

        .song-title {
            font-weight: 600;
            font-size: 17px;
            margin: 0
        }

        .song-artist {
            color: var(--ink-soft);
            font-size: 14px;
            margin: 1px 0 0
        }

        .player {
            position: relative;
            margin: 12px 0 0;
            aspect-ratio: 16/9;
            border-radius: 5px;
            overflow: hidden;
            background: #1c1916;
            cursor: pointer;
            border: 1px solid #d4c8ac
        }

        .player img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: .92
        }

        .player iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block
        }

        .play-btn {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--paper-2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px -4px rgba(0, 0, 0, .5);
            transition: transform .15s ease
        }

        .player:hover .play-btn {
            transform: scale(1.06)
        }

        .play-btn::after {
            content: "";
            border-style: solid;
            border-width: 11px 0 11px 18px;
            border-color: transparent transparent transparent var(--play);
            margin-left: 4px
        }

        .note {
            font-family: "Caveat", cursive;
            font-size: clamp(19px, 5vw, 22px);
            line-height: 1.35;
            color: var(--ink);
            margin: 14px 0 0;
            padding-left: 14px;
            border-left: 2px solid var(--accent)
        }

        /* ========================================================
     POLAROIDS — taped, tilted photo frames
     ======================================================== */
        .cluster {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 6px 14px;
            margin: 8px 0
        }

        .polaroid {
            --tilt: 0deg;
            position: relative;
            width: 198px;
            margin: 22px auto;
            padding: 12px 12px 42px;
            background: var(--photo);
            box-shadow: 0 16px 28px -14px rgba(41, 36, 30, .55), 0 1px 0 rgba(0, 0, 0, .05);
            transform: rotate(var(--tilt));
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .cluster .polaroid {
            margin: 14px 8px
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.03);
            box-shadow: 0 22px 36px -14px rgba(41, 36, 30, .6);
            z-index: 6
        }

        .polaroid .frame {
            position: relative;
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #e7e1d2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .polaroid .hint {
            font-family: "Space Mono", monospace;
            font-size: 11px;
            color: #a59a82;
            text-align: center;
            padding: 10px;
            line-height: 1.5;
            word-break: break-word;
        }

        .polaroid .cap {
            font-family: "Caveat", cursive;
            font-size: 20px;
            line-height: 1.15;
            text-align: center;
            color: #3a342b;
            margin-top: 11px;
            min-height: 1em;
        }

        /* tape — single strip across the top */
        .polaroid::before {
            content: "";
            position: absolute;
            z-index: 3;
            top: -9px;
            left: 50%;
            width: 78px;
            height: 26px;
            transform: translateX(-50%) rotate(-2.5deg);
            background: var(--tape);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
            border-left: 1px dashed rgba(255, 255, 255, .45);
            border-right: 1px dashed rgba(255, 255, 255, .45);
        }

        /* tape — two diagonal corners (alternate look) */
        .polaroid.tape2::before {
            left: 16px;
            top: -8px;
            width: 62px;
            transform: rotate(-32deg)
        }

        .polaroid.tape2::after {
            content: "";
            position: absolute;
            z-index: 3;
            top: -8px;
            right: 16px;
            width: 62px;
            height: 26px;
            transform: rotate(32deg);
            background: var(--tape);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
            border-left: 1px dashed rgba(255, 255, 255, .45);
            border-right: 1px dashed rgba(255, 255, 255, .45);
        }

        .signoff {
            font-family: "Caveat", cursive;
            font-size: clamp(22px, 6vw, 28px);
            text-align: right;
            margin: 30px 4px 0;
            color: var(--ink)
        }

        @media (prefers-reduced-motion:reduce) {
            .player:hover .play-btn {
                transform: none
            }

            .polaroid:hover {
                transform: rotate(var(--tilt))
            }
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px
        }
    </style>
</head>

<body>

    <main class="card">

        <svg class="cassette" viewBox="0 0 120 76" aria-hidden="true">
            <rect x="2" y="2" width="116" height="72" rx="6" fill="none" stroke="#356B63" stroke-width="2.5" />
            <rect x="14" y="14" width="92" height="26" rx="3" fill="none" stroke="#6B6356" stroke-width="1.5" />
            <circle cx="44" cy="55" r="11" fill="none" stroke="#29241E" stroke-width="2.5" />
            <circle cx="76" cy="55" r="11" fill="none" stroke="#29241E" stroke-width="2.5" />
            <circle cx="44" cy="55" r="3" fill="#C0492F" />
            <circle cx="76" cy="55" r="3" fill="#C0492F" />
        </svg>

        <!-- ===== EDIT THE HEADER TEXT HERE ===== -->
        <p class="eyebrow">Happy Father's Day</p>
        <h1 class="title">A Digital Mix-Tape for Papa</h1>
        <p class="dedication">Songs that mean something to you, and to us. With my favorite photos of you from my camera
            roll.</p>

        <hr class="divider">

        <!-- everything (photos + tracks) renders here -->
        <div id="page"></div>

        <!-- ===== EDIT THE SIGN-OFF HERE ===== -->
        <p class="signoff">Love,<br>Callie</p>

    </main>

    <script>
        /* ================================================================
           1) YOUR SONGS
           title / artist / youtube (paste the full link or the ID) / note
           ================================================================ */
        const SONGS = [
            {
                title: "Seventy-Six Trombones",
                artist: "The Music Man",
                youtube: "https://www.youtube.com/watch?v=FGNgN43oUbg",
                note: "One of your favorite songs."
            },
            {
                title: "Thriller",
                artist: "Michael Jackson",
                youtube: "https://www.youtube.com/watch?v=sOnqjkJTMaA",
                note: "It was between this one and Bad. I remember you showing us Michael Jackson for the first time, as well as Weird Al Yankovic's versions."
            },
            {
                title: "It's a Small World",
                artist: "Disney",
                youtube: "https://www.youtube.com/watch?v=PxRW-duSCLA",
                note: "Do you remember this ride at Magic Kingdom?"
            },
            {
                title: "The Lion Sleeps Tonight",
                artist: "The Tokens",
                youtube: "https://www.youtube.com/watch?v=OQlByoPdG6c",
                note: "We used to make you play this on the way home from church ALL. THE. TIME."
            },
            {
                title: "Dueling Banjos",
                artist: "Not for sure",
                youtube: "https://www.youtube.com/watch?v=J6UG1Jlwiow",
                note: "Kudos to Grandma for this one."
            },
            {
                title: "Chim Chim Cher-ee",
                artist: "Mary Poppins",
                youtube: "https://www.youtube.com/watch?v=kG6O4N3wxf8",
                note: "And a spoonful of sugar."
            },
            {
                title: "Zip-a-Dee-Doo-Dah",
                artist: "Not for sure",
                youtube: "https://www.youtube.com/watch?v=6bWyhj7siEY",
                note: "Zip a dee day."
            },
            {
                title: "Chitty Chitty Bang Bang",
                artist: "Not for sure",
                youtube: "https://www.youtube.com/watch?v=ZTTzcXSLjhI",
                note: "CHITTY CHITTY BANG BANG."
            },
            {
                title: "On the Good Ship Lollipop",
                artist: "Shirley Temple",
                youtube: "https://www.youtube.com/watch?v=WLLSqpYyPD8",
                note: "This one took a little thinkin to remember."
            },
            {
                title: "I am a Promise",
                artist: "No for sure",
                youtube: "https://www.youtube.com/watch?v=f9BEWS9Mx1M",
                note: "Obviously, mine and Collin's version is MUCH better than this one."
            },
            {
                title: "Marian the Librarian",
                artist: "The Music Man",
                youtube: "https://www.youtube.com/watch?v=Hf4iRGHoRrw",
                note: "Loved this one."
            },
            {
                title: "Amazing Grace",
                artist: "Robert Shaw",
                youtube: "https://www.youtube.com/watch?v=TxL67WKrOeU",
                note: "My favorite version of Amazing Grace. Every time I hear this song, I think of you."
            },


        ];

        /* ================================================================
           2) YOUR PHOTOS
           src     – path to the JPEG. Put your images in a folder called
                     "photos" next to this file, then reference them like
                     "photos/fishing-trip.jpg"
           caption – the handwritten line under the photo (can be left "")
           Add or remove { ... } blocks for as many photos as you want.
           They spread themselves down the page automatically.
           ================================================================ */
        const PHOTOS = [
            { src: "images/dad-1.jpg", caption: "Eatin a turkey leg at the Ren Fair - May 31, 2025" },
            { src: "images/dad-2.jpg", caption: "WOW, look at this big fishie! - April 06, 2016" },
            { src: "images/dad-3.jpg", caption: "Another Pait family Christmas party at the Moose Lodge - December 03, 2022" },
            { src: "images/dad-4.jpg", caption: "Halloween - October 31, 2016" },
            { src: "images/dad-5.jpg", caption: "Memories at the old office - Jan 12, 2017" },
            { src: "images/dad-6.jpg", caption: "Always giving me a back ride" },
            { src: "images/dad-7.jpg", caption: "Gatlinburg ride - August 04, 2022" },
            { src: "images/dad-8.jpg", caption: "Date unknown, but looks like another family Christmas party. - Maybe December 2006" },
            { src: "images/dad-14.jpg", caption: "The Alcatraz museum in Gatlinburg - August 03, 2022" },
            { src: "images/dad-10.jpg", caption: "Strawberry look like your nose - April 09, 2019" },
            { src: "images/dad-11.JPG", caption: "Definitely at a birthday dinner - August 25, 2018" },
            { src: "images/dad-12.JPG", caption: "You got cutoff - August 07, 2017" },
            { src: "images/dad-13.JPG", caption: "Baby Kayden! - June 18, 2017" },
            { src: "images/dad-9.jpg", caption: "Partners in crime - November 04, 2023" }

        ];

        /* ---------- nothing below here needs editing ---------- */

        function videoId(input) {
            if (!input) return "";
            const s = String(input).trim();
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
            const m =
                s.match(/[?&]v=([A-Za-z0-9_-]{11})/) ||
                s.match(/youtu\.be\/([A-Za-z0-9_-]{11})/) ||
                s.match(/embed\/([A-Za-z0-9_-]{11})/);
            return m ? m[1] : "";
        }

        const TILTS = [-4, 3, -3, 4.5, -2.5, 5, -5, 2.5];

        function makeTrack(song, i) {
            const id = videoId(song.youtube);
            const num = String(i + 1).padStart(2, "0");

            const track = document.createElement("section");
            track.className = "track";

            const left = document.createElement("div");
            left.className = "num";
            left.textContent = num;

            const right = document.createElement("div");
            const t = document.createElement("p");
            t.className = "song-title"; t.textContent = song.title || "Untitled";
            const a = document.createElement("p");
            a.className = "song-artist"; a.textContent = song.artist || "";
            right.appendChild(t); right.appendChild(a);

            if (id) {
                const player = document.createElement("div");
                player.className = "player";
                player.setAttribute("role", "button");
                player.setAttribute("tabindex", "0");
                player.setAttribute("aria-label", "Play " + (song.title || "song"));
                const thumb = document.createElement("img");
                thumb.loading = "lazy";
                thumb.src = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
                thumb.alt = "";
                const btn = document.createElement("span");
                btn.className = "play-btn";
                player.appendChild(thumb); player.appendChild(btn);
                const load = () => {
                    const frame = document.createElement("iframe");
                    frame.src = "https://www.youtube.com/embed/" + id + "?autoplay=1&rel=0";
                    frame.allow = "autoplay; encrypted-media; picture-in-picture";
                    frame.allowFullscreen = true;
                    player.innerHTML = ""; player.appendChild(frame);
                };
                player.addEventListener("click", load);
                player.addEventListener("keydown", e => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); load(); }
                });
                right.appendChild(player);
            }

            if (song.note) {
                const n = document.createElement("p");
                n.className = "note"; n.textContent = song.note;
                right.appendChild(n);
            }

            track.appendChild(left); track.appendChild(right);
            return track;
        }

        function makePolaroid(photo, idx) {
            const el = document.createElement("figure");
            el.className = "polaroid" + (idx % 2 ? " tape2" : "");
            el.style.setProperty("--tilt", TILTS[idx % TILTS.length] + "deg");

            const frame = document.createElement("div");
            frame.className = "frame";

            const showHint = () => {
                frame.innerHTML = "";
                const hint = document.createElement("span");
                hint.className = "hint";
                hint.textContent = photo.src ? photo.src : "add a photo here";
                frame.appendChild(hint);
            };

            if (photo.src) {
                const img = document.createElement("img");
                img.loading = "lazy";
                img.alt = photo.caption || "";
                img.onerror = showHint;          // missing file -> show the filename
                img.src = photo.src;
                frame.appendChild(img);
            } else {
                showHint();
            }

            const cap = document.createElement("figcaption");
            cap.className = "cap";
            cap.textContent = photo.caption || "";

            el.appendChild(frame);
            el.appendChild(cap);
            return el;
        }

        (function render() {
            const page = document.getElementById("page");
            const photos = PHOTOS.slice();

            // a couple of photos taped up top
            const topCount = Math.min(2, photos.length);
            if (topCount) {
                const cluster = document.createElement("div");
                cluster.className = "cluster";
                for (let k = 0; k < topCount; k++) cluster.appendChild(makePolaroid(photos.shift(), k));
                page.appendChild(cluster);
            }

            // remaining photos get sprinkled between the songs
            const step = photos.length ? Math.max(1, Math.floor(SONGS.length / (photos.length + 1))) : 1;
            let pIdx = topCount;

            SONGS.forEach((song, i) => {
                page.appendChild(makeTrack(song, i));
                if (photos.length && (i + 1) % step === 0) {
                    page.appendChild(makePolaroid(photos.shift(), pIdx++));
                }
            });

            // anything left over goes in a cluster at the bottom
            if (photos.length) {
                const cluster = document.createElement("div");
                cluster.className = "cluster";
                while (photos.length) cluster.appendChild(makePolaroid(photos.shift(), pIdx++));
                page.appendChild(cluster);
            }
        })();
    </script>
</body>

</html>
